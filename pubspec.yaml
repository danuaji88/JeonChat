name: jeonchat
description: JeonChat - AI Integrated Coworker dashboard for JEON.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  audioplayers: ^6.8.1
  speech_to_text: ^7.0.0
  image_picker: ^1.0.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  video_player: ^2.8.2
  share_plus: ^10.0.0
  record: ^5.2.1
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4
  flutter_facebook_auth: ^7.2.0
  web: ^1.1.0
  desktop_drop: ^0.7.1
  cross_file: ^0.3.5

dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
